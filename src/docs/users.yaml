paths:
  /api/users:
    get:
      tags:
        - Users
      summary: Get all users
      responses:
        '200':
          $ref: '#/components/responses/UsersGetResponse'

    post:
      tags: 
        - Users
      summary: Create User
      description: >
        Creates a new user in system. The request body contain the user's details.
        The email address can only be registered once.
      requestBody:
        required: true 
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/UserCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/UserNotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'

  /api/users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Returns the details of a single user by their ID.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '404':
          $ref: '#/components/responses/UserNotFoundResponse'

    patch:
      tags:
        - Users
      summary: Update user
      description: >
        Updates one or more fields of an existing user. Only the fields
        included in the request body are modified.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/UserNotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'

    delete:
      tags:
        - Users
      summary: Delete user
      description: Deletes an existing user by ID.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/UserDeletedResponse'
        '404':
          $ref: '#/components/responses/UserNotFoundResponse'
