paths:
  /api/users:
    get:
      tags:
        - Users
      summary: Get all users
      responses:
        '200':
          $ref: '#/components/responses/UsersGetResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

    post:
      tags: 
        - Users
      summary: Create User
      description: >
        Creates a new user in system. The request body contain the user's details.
        The email address can only be registered once.
      requestBody:
        required: true 
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/UserCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/UserNotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Returns the details of a single user by their ID.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/InvalidIdResponse'
        '404':
          $ref: '#/components/responses/UserNotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

    patch:
      tags:
        - Users
      summary: Update user
      description: >
        Updates one or more fields of an existing user. Only the fields
        included in the request body are modified.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          description: >
            Either the request body failed validation (error: VALIDATION_ERROR)
            or the ID in the path is not a valid format (error: INVALID_ID).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: VALIDATION_ERROR
                message: Validation error
        '404':
          $ref: '#/components/responses/UserNotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

    delete:
      tags:
        - Users
      summary: Delete user
      description: Deletes an existing user by ID.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/UserDeletedResponse'
        '400':
          $ref: '#/components/responses/InvalidIdResponse'
        '404':
          $ref: '#/components/responses/UserNotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/users/{id}/documents:
    post:
      tags:
        - Users
      summary: Upload user document
      description: >
        Uploads an identification document (ID card, driver license, proof of
        address, etc.) for an existing user. Sent as multipart/form-data.
        The user must exist and document_type must be one of the allowed values.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadUserDocumentRequest'
      responses:
        '201':
          $ref: '#/components/responses/UserDocumentUploadedResponse'
        '400':
          description: >
            No file provided (FILE_REQUIRED), disallowed file type
            (INVALID_FILE_TYPE), file too large (FILE_TOO_LARGE), or
            document_type missing/invalid (INVALID_DOCUMENT_TYPE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INVALID_DOCUMENT_TYPE
                message: Invalid document type
        '404':
          $ref: '#/components/responses/UserNotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
